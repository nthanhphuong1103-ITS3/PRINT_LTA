<!DOCTYPE html>
<html lang="vi" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập SSO i-Office - Hệ Thống In Ấn LTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Top Theme Toggle Button -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleTheme()"
            class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 p-2.5 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2 text-xs font-bold">
            <span id="theme-icon-sun" class="hidden dark:inline text-amber-400 text-sm">☀️ Sáng</span>
            <span id="theme-icon-moon" class="inline dark:hidden text-indigo-600 text-sm">🌙 Tối</span>
        </button>
    </div>

    <!-- Main Container Card (Split Screen - Light Theme Primary) -->
    <div
        class="w-full max-w-4xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 transition-all duration-300">

        <!-- Left Panel: Full-Bleed Printer Image Area -->
        <div
            class="relative p-6 md:p-8 flex flex-col justify-between min-h-[340px] md:min-h-[460px] overflow-hidden border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800 group">
            <!-- Full Fill Printer Image Background -->
            <img src="/static/images/printer.jpg" alt="LTA Printer"
                class="absolute inset-0 w-full h-full object-cover object-center transform transition-transform duration-500 group-hover:scale-105">

            <!-- Vignette Overlay for Crisp Contrast -->
            <div
                class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/10 to-slate-950/50 pointer-events-none">
            </div>

            <!-- Top Logo Badge Overlay -->
            <div class="relative z-10 flex items-center gap-3">
                <div
                    class="bg-white/90 dark:bg-slate-900/80 backdrop-blur-md border border-white/40 dark:border-slate-800 px-4 py-2 rounded-2xl shadow-md flex items-center gap-2.5">
                    <div
                        class="w-7 h-7 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-600 flex items-center justify-center text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                            </path>
                        </svg>
                    </div>
                    <span class="font-extrabold text-xs tracking-wider text-slate-900 dark:text-white uppercase">LTA
                        PRINT</span>
                </div>
            </div>

            <!-- Bottom Footer Note Overlay -->
            <div class="relative z-10">
                <div
                    class="bg-slate-950/70 backdrop-blur-md border border-white/20 px-3.5 py-1.5 rounded-xl inline-block text-[11px] text-slate-200 font-medium shadow-sm">
                    Bảo mật bởi LTA-IT Security &copy; 2026
                </div>
            </div>
        </div>

        <!-- Right Panel: Login Form with Account & Password Fields (Light Theme Primary) -->
        <div class="p-8 md:p-10 flex flex-col justify-between bg-white dark:bg-slate-900">
            <div>
                <!-- Header -->
                <div class="mb-6">
                    <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">Chào mừng trở lại!</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Đăng nhập bằng tài khoản i-Office của bạn
                    </p>
                </div>

                <!-- Form with 2 Input Fields + i-Office Submit Button -->
                <form action="/api/auth/login" method="POST" class="space-y-4">
                    <div>
                        <label for="msnv" class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Tài
                            Khoản / MSNV <span class="text-rose-500">*</span></label>
                        <input type="text" id="msnv" name="msnv" required placeholder="Nhập MSNV của bạn"
                            class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 text-xs font-semibold placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 transition-all">
                    </div>

                    <div>
                        <label for="password"
                            class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Mật Khẩu i-Office
                            <span class="text-rose-500">*</span></label>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                            class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 text-xs font-mono placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 transition-all">
                    </div>

                    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 pt-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" checked
                                class="rounded border-slate-300 dark:border-slate-700 text-indigo-600 focus:ring-indigo-500">
                            Ghi nhớ phiên
                        </label>
                        <a href="#" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Quên mật
                            khẩu?</a>
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-700 hover:from-indigo-500 hover:to-blue-500 text-white font-extrabold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2 text-xs uppercase tracking-wider mt-4">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                            </path>
                        </svg>
                        <span>ĐĂNG NHẬP BẰNG I-OFFICE</span>
                    </button>
                </form>
            </div>

            <!-- Bottom Redirect Link -->
            <div
                class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400">
                Bạn là Quản trị viên? <a href="/loginadmin"
                    class="text-indigo-600 dark:text-indigo-400 font-extrabold hover:underline ml-1">Đăng nhập Admin
                    Portal</a>
            </div>
        </div>

    </div>

    <!-- Theme Switcher Script (Default Theme = Light) -->
    <script>
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        }

        // Default to Light Mode
        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);
    </script>
</body>

</html>
