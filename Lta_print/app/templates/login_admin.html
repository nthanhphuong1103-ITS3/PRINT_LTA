<!DOCTYPE html>
<html lang="vi" class="light">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Viên - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Top Theme Toggle Button -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleTheme()"
            class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 p-2.5 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2 text-xs font-bold">
            <span id="theme-icon-sun" class="hidden dark:inline text-amber-400 text-sm">☀️ Sáng</span>
            <span id="theme-icon-moon" class="inline dark:hidden text-indigo-600 text-sm">🌙 Tối</span>
        </button>
    </div>

    <!-- Main Container Card (Split Screen) -->
    <div
        class="w-full max-w-4xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2 transition-all duration-300">

        <!-- Left Panel: Full-Bleed Printer Image Area -->
        <div
            class="relative p-6 md:p-8 flex flex-col justify-between min-h-[320px] md:min-h-[440px] overflow-hidden border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800 group">
            <!-- Full Fill Printer Image Background -->
            <img src="/static/images/printer.jpg" alt="LTA Admin Printer"
                class="absolute inset-0 w-full h-full object-cover object-center transform transition-transform duration-500 group-hover:scale-105">

            <!-- Dark Gradient Vignette for Text Contrast -->
            <div
                class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-slate-950/60 pointer-events-none">
            </div>

            <!-- Top Logo Badge Overlay -->
            <div class="relative z-10 flex items-center gap-3">
                <div
                    class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-white/30 dark:border-slate-800 px-3.5 py-1.5 rounded-2xl shadow-md flex items-center gap-2.5">
                    <div
                        class="w-7 h-7 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-600 flex items-center justify-center text-white font-extrabold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v4a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </div>
                    <span class="font-extrabold text-xs tracking-wider text-amber-600 dark:text-amber-400 uppercase">LTA
                        ADMIN PORTAL</span>
                </div>
            </div>

            <!-- Bottom Footer Note Overlay -->
            <div class="relative z-10">
                <div
                    class="bg-slate-950/60 backdrop-blur-md border border-white/10 px-3.5 py-1.5 rounded-xl inline-block text-[11px] text-slate-300 font-medium">
                    Bảo mật bởi LTA Security &copy; 2026
                </div>
            </div>
        </div>

        <!-- Right Panel: Admin Login Form -->
        <div class="p-8 md:p-10 flex flex-col justify-between bg-white dark:bg-slate-900">
            <div>
                <!-- Header -->
                <div class="mb-6">
                    <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Đăng Nhập Quản Trị</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Vui lòng nhập tài khoản Admin của bạn</p>
                </div>

                {% if error %}
                <div
                    class="mb-5 bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 p-3 rounded-xl text-xs font-semibold text-center flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    {{ error }}
                </div>
                {% endif %}

                <!-- Form -->
                <form action="/api/auth/loginadmin" method="POST" class="space-y-4">
                    <div>
                        <label for="username"
                            class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Tên Tài Khoản
                            Admin <span class="text-rose-500">*</span></label>
                        <input type="text" id="username" name="username" required placeholder="Tài khoản admin"
                            class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 text-xs font-bold placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                    </div>

                    <div>
                        <label for="password"
                            class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Mật Khẩu Quản
                            Trị <span class="text-rose-500">*</span></label>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                            class="w-full bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-slate-100 text-xs font-mono placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-400 hover:to-rose-500 text-white font-extrabold py-3.5 px-6 rounded-xl shadow-lg shadow-amber-500/20 hover:shadow-amber-500/35 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2 text-xs mt-6">
                        <span>XÁC NHẬN ĐĂNG NHẬP ADMIN →</span>
                    </button>
                </form>
            </div>

            <!-- Bottom Redirect Link -->
            <div
                class="mt-6 pt-3 border-t border-slate-100 dark:border-slate-800/80 text-center text-xs text-slate-500">
                Quay lại <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Đăng
                    nhập SSO User</a>
            </div>
        </div>

    </div>

    <!-- Theme Switcher Script -->
    <script>
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

    </script>
</body>

</html>
